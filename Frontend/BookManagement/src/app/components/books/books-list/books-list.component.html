<div class="container my-5">
    <h1 class="mb-3">Books</h1>

    <table class="table" *ngIf="books && books.length > 0">
        <thead>
            <tr>
                <th>Id</th>
                <th>Title</th>
                <th>Auther</th>
                <th>ISBN</th>
                <th>Publication Date</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let book of books">
                <td>{{ book.id }}</td>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.isbn }}</td>
                <td>{{ book.publicationDate }}</td>
            </tr>
        </tbody>
    </table>

    <p *ngIf="!books || books.length <= 0">No books found..</p>

    <!-- *ngFor="let book of books" *ngIf="books && books.length > 0" -->
</div>
